services:
  postgres:
    image: postgres:17-alpine
    container_name: aod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aod_user
      POSTGRES_PASSWORD: aod_password
      POSTGRES_DB: ai_opportunity_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aod_user -d ai_opportunity_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aod_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql+psycopg2://aod_user:aod_password@postgres:5432/ai_opportunity_db"
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      GITHUB_TOKEN: "${GITHUB_TOKEN:-}"
      REDDIT_CLIENT_ID: "${REDDIT_CLIENT_ID:-}"
      REDDIT_CLIENT_SECRET: "${REDDIT_CLIENT_SECRET:-}"
      REDDIT_USER_AGENT: "ai-opportunity-platform/1.0"
      CHROMA_PERSIST_DIR: "/app/chroma_db"
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aod_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html

volumes:
  postgres_data:
  chroma_data:
